name: PR Test

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

concurrency:
  group: pr-test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout PR head commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests and enforce coverage threshold
        id: coverage
        run: ./scripts/check-ci.sh coverage.out

      - name: Write workflow summary
        run: |
          {
            echo "## Go Test Coverage"
            echo
            echo "- Total coverage: ${{ steps.coverage.outputs.total }}%"
            echo "- Required coverage: ${{ steps.coverage.outputs.required }}%"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: coverage.out
          if-no-files-found: error
